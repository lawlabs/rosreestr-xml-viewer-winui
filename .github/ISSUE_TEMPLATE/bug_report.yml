name: Ошибка
description: Проблема с импортом, отображением или сравнением
body:
  - type: markdown
    attributes:
      value: Не прикладывайте настоящие выписки, подписи или персональные данные. Используйте минимальный вымышленный пример.
  - type: textarea
    id: description
    attributes:
      label: Что произошло и что ожидалось
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Как воспроизвести
      description: Действия, текст ошибки; для XML — корневой элемент, namespace и версия без персональных данных.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Windows и версия приложения или commit
    validations:
      required: true
